{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css', v='4') }}">
<section class="auth-page register-page">
  <div class="auth-panel register-panel">
    <div class="register-card">
      <h1 class="login-title">Forgot password?</h1>
      <p class="auth-subtitle">Enter the email address on your account and we’ll send a reset link.</p>
      <form method="post" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Email address
          <span class="auth-input-shell"><input type="email" name="email" required maxlength="120" autocomplete="email" placeholder="you@company.com"></span>
        </label>
        <button class="auth-submit" type="submit">Send reset link</button>
      </form>
      <p class="auth-register"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
    </div>
  </div>
</section>
{% endblock %}
