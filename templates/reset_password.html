{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css', v='4') }}">
<section class="auth-page register-page">
  <div class="auth-panel register-panel">
    <div class="register-card">
      <h1 class="login-title">Choose a new password</h1>
      <p class="auth-subtitle">Use at least 8 characters, including letters and numbers.</p>
      <form method="post" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>New password <span class="auth-input-shell"><input type="password" name="password" required minlength="8" autocomplete="new-password"></span></label>
        <label>Confirm new password <span class="auth-input-shell"><input type="password" name="confirm_password" required minlength="8" autocomplete="new-password"></span></label>
        <button class="auth-submit" type="submit">Update password</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
