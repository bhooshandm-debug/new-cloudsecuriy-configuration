{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css', v='4') }}">
<section class="auth-page login-page">
  <div class="auth-panel login-panel">
    <div class="login-card">
      <div class="login-avatar" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 4L5 9.5V17C5 23.8 9.7 30 16 31.5C22.3 30 27 23.8 27 17V9.5L16 4Z" fill="#0EA5E9" stroke="#38BDF8" stroke-width="1.5"/>
          <path d="M11.5 16.5L14.5 19.5L20.5 13.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="login-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your cloud security view</p>
      <form method="post" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Email or username
          <span class="auth-input-shell">
            <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
            <input type="text" name="identifier" required autofocus autocomplete="username" placeholder="you@company.com">
          </span>
        </label>
        <label>Password
          <span class="password-field auth-input-shell">
            <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
            <input id="login-password" type="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
            <button class="password-toggle" type="button" aria-controls="login-password" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6"/></svg>
            </button>
          </span>
        </label>
        <div class="auth-options">
          <label class="remember-choice"><input type="checkbox" name="remember" value="1"><span>Keep me signed in</span></label>
          <a class="auth-help" href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
        </div>
        <button class="auth-submit" type="submit">Log in</button>
      </form>
      <p class="auth-register">New to Config Audit? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p>
    </div>
  </div>
</section>
<script src="{{ url_for('static', filename='js/auth.js', v='4') }}" defer></script>
{% endblock %}
