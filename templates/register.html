{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css', v='4') }}">
<section class="auth-page register-page">
  <div class="auth-panel register-panel">
    <div class="register-card">
      <div class="login-avatar" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 4L5 9.5V17C5 23.8 9.7 30 16 31.5C22.3 30 27 23.8 27 17V9.5L16 4Z" fill="#0EA5E9" stroke="#38BDF8" stroke-width="1.5"/>
          <path d="M11.5 16.5L14.5 19.5L20.5 13.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="login-title">Create Account</h1>
      <p class="auth-subtitle">Set up your secure cloud security workspace.</p>
      <form method="post" class="auth-form register-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <label>Username
            <span class="auth-input-shell">
              <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.1-7 8-7s8 2.6 8 7"/></svg>
              <input name="username" required minlength="3" maxlength="40" autocomplete="username" placeholder="Choose a username">
            </span>
          </label>
          <label>Work email
            <span class="auth-input-shell">
              <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
              <input type="email" name="email" required autocomplete="email" placeholder="you@company.com">
            </span>
          </label>
          <label>Password
            <span class="password-field auth-input-shell">
              <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
              <input id="register-password" type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Create a password">
              <button class="password-toggle" type="button" aria-controls="register-password" aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6"/></svg>
              </button>
            </span>
            <small class="register-password-help">At least 8 characters, including letters and numbers.</small>
          </label>
          <button class="auth-submit" type="submit">Create account</button>
      </form>
      <p class="auth-register">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>.</p>
      <p class="register-admin-note"><span aria-hidden="true">i</span>The first account created becomes the administrator.</p>
    </div>
  </div>
</section>
<script src="{{ url_for('static', filename='js/auth.js', v='4') }}" defer></script>
{% endblock %}
